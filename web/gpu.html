<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Видеокарта — local-ai</title>
<style>
  :root {
    color-scheme: dark;
    --plane:      #0d0d0d;
    --surface:    #111110;
    --ink:        #ffffff;
    --ink-2:      #c3c2b7;
    --muted:      #898781;
    --grid:       #2c2c2a;
    --axis:       #383835;
    --border:     rgba(255, 255, 255, 0.10);
    --series:     #3987e5;
    --warning:    #fab219;
    --critical:   #d03b3b;
    --font: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px;
    background: var(--plane); color: var(--ink); font-family: var(--font);
  }
  header { display: flex; flex-wrap: wrap; gap: 16px; align-items: baseline; }
  h1 { font-size: 18px; font-weight: 600; margin: 0; }
  .meta { color: var(--muted); font-size: 13px; }
  .controls { display: flex; gap: 8px; margin: 16px 0 20px; flex-wrap: wrap; }
  button {
    font: inherit; font-size: 13px; padding: 6px 12px; cursor: pointer;
    color: var(--ink-2); background: var(--surface);
    border: 1px solid var(--border); border-radius: 6px;
  }
  button[aria-pressed="true"] { color: var(--ink); border-color: var(--series); }
  .grid {
    display: grid; gap: 16px;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  }
  .card {
    position: relative; padding: 16px;
    background: var(--surface);
    border: 1px solid var(--border); border-radius: 10px;
  }
  .card h2 {
    font-size: 13px; font-weight: 500; color: var(--ink-2);
    margin: 0 0 4px; letter-spacing: 0.01em;
  }
  .value { font-size: 28px; font-weight: 600; line-height: 1.1; }
  .value.warning  { color: var(--warning); }
  .value.critical { color: var(--critical); }
  .value small { font-size: 14px; font-weight: 400; color: var(--muted); }
  .peak { font-size: 12px; color: var(--muted); margin-top: 2px; }
  svg { display: block; width: 100%; height: 120px; margin-top: 10px; }
  .tip {
    position: absolute; pointer-events: none; opacity: 0;
    padding: 6px 8px; font-size: 12px; white-space: nowrap;
    background: var(--plane); color: var(--ink);
    border: 1px solid var(--border); border-radius: 6px;
    transition: opacity .1s;
  }
  table { border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  caption { text-align: left; color: var(--muted); padding: 8px 0; }
  th, td { padding: 5px 14px 5px 0; text-align: left; }
  th { color: var(--ink-2); font-weight: 500; border-bottom: 1px solid var(--axis); }
  td { color: var(--ink-2); }
  #table[hidden] { display: none; }
  .err { color: var(--critical); font-size: 13px; }
</style>
</head>
<body>

<header>
  <h1>Видеокарта</h1>
  <span class="meta" id="meta">загрузка…</span>
</header>

<div class="controls" role="group" aria-label="Период">
  <button data-range="900"   aria-pressed="true">15 мин</button>
  <button data-range="3600"  aria-pressed="false">1 час</button>
  <button data-range="21600" aria-pressed="false">6 часов</button>
  <button data-range="86400" aria-pressed="false">24 часа</button>
  <button id="toggle-table" aria-pressed="false">Таблица</button>
</div>

<div class="grid" id="cards"></div>
<div id="table" hidden></div>
<p class="err" id="err" hidden></p>

<script>
const API = location.origin + '/api/v1';
const OLLAMA = 'http://127.0.0.1:11434/api/ps';

// Одна серия на график — идентичность несёт заголовок, легенда не нужна.
// Четыре измерения разного масштаба разнесены по отдельным графикам:
// вторая ось на одном полотне искажает сравнение.
const METRICS = [
  { key: 'gpu_utilization', title: 'Загрузка', dim: 'gpu',
    unit: '%', min: 0, max: 100 },
  { key: 'frame_buffer_memory_usage', title: 'Занято VRAM', dim: 'used',
    unit: 'МБ', min: 0, scale: 1 / (1024 * 1024) },
  { key: 'temperature', title: 'Температура', dim: 'temperature',
    unit: '°C', min: 20, warn: 80, crit: 90 },
  { key: 'power_draw', title: 'Потребление', dim: 'power_draw',
    unit: 'Вт', min: 0 },
];

const PLOT = { w: 600, h: 120, pad: 6 };
let range = 900;
let charts = {};

const fmt = (v, unit) =>
  (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 10) / 10) + ' ' + unit;

async function json(url) {
  const response = await fetch(url);
  if (!response.ok) throw new Error(url + ' → HTTP ' + response.status);
  return response.json();
}

// Идентификатор графика содержит UUID видеокарты — он свой на каждой машине.
async function discover() {
  const { charts: all } = await json(API + '/charts');
  const found = {};
  for (const metric of METRICS) {
    found[metric.key] = Object.keys(all)
      .find(id => id.startsWith('nvidia_smi.gpu_') && id.endsWith('_' + metric.key));
  }
  return found;
}

async function series(metric) {
  const id = charts[metric.key];
  if (!id) return [];
  const url = `${API}/data?chart=${id}&after=-${range}&points=180`
            + `&group=average&format=json&dimensions=${metric.dim}`;
  const { data } = await json(url);
  const scale = metric.scale || 1;
  return data
    .filter(row => row[1] !== null)
    .map(row => ({ t: row[0] * 1000, v: row[1] * scale }))
    .reverse();                       // Netdata отдаёт от новых к старым
}

function build() {
  document.getElementById('cards').innerHTML = METRICS.map(metric => `
    <section class="card" id="card-${metric.key}">
      <h2>${metric.title}</h2>
      <div class="value" data-role="value">—</div>
      <div class="peak" data-role="peak"></div>
      <svg viewBox="0 0 ${PLOT.w} ${PLOT.h}" preserveAspectRatio="none"
           role="img" aria-label="${metric.title}: динамика за выбранный период">
        <g data-role="grid"></g>
        <path data-role="area" fill="var(--series)" fill-opacity="0.12"></path>
        <path data-role="line" fill="none" stroke="var(--series)" stroke-width="2"
              stroke-linejoin="round" vector-effect="non-scaling-stroke"></path>
        <g data-role="dots"></g>
        <g data-role="cursor" opacity="0">
          <line y1="0" y2="${PLOT.h}" stroke="var(--muted)" stroke-width="1"
                vector-effect="non-scaling-stroke"></line>
          <circle r="4" fill="var(--series)" stroke="var(--surface)"
                  stroke-width="2"></circle>
        </g>
      </svg>
      <div class="tip" data-role="tip"></div>
    </section>`).join('');
}

function draw(metric, points, from, to) {
  const card = document.getElementById('card-' + metric.key);
  const valueEl = card.querySelector('[data-role="value"]');
  const peakEl = card.querySelector('[data-role="peak"]');
  const lineEl = card.querySelector('[data-role="line"]');
  const areaEl = card.querySelector('[data-role="area"]');
  const dotsEl = card.querySelector('[data-role="dots"]');

  // Пустой ответ обязан стирать прежнюю отрисовку: иначе на экране остаются
  // цифры и линия от предыдущего периода — худший вид ошибки, незаметный.
  if (!points.length) {
    valueEl.textContent = 'нет данных';
    valueEl.className = 'value';
    peakEl.textContent = 'за выбранный период истории нет';
    lineEl.removeAttribute('d');
    areaEl.removeAttribute('d');
    dotsEl.innerHTML = '';
    card.querySelector('[data-role="grid"]').innerHTML = '';
    card._plot = null;
    return;
  }

  const values = points.map(p => p.v);
  const peak = Math.max(...values);
  const last = values[values.length - 1];

  const low = Math.min(metric.min ?? Math.min(...values), Math.min(...values));
  const high = metric.max ?? Math.max(peak * 1.15, low + 1);

  // Ось X по времени, а не по номеру точки: если истории меньше окна,
  // данные должны занимать свою долю справа, а не растягиваться на всё окно.
  const span = Math.max(1, to - from);
  const x = i => PLOT.pad + (points[i].t - from) / span * (PLOT.w - 2 * PLOT.pad);
  const y = v => {
    const share = (v - low) / (high - low || 1);
    return PLOT.h - PLOT.pad - share * (PLOT.h - 2 * PLOT.pad);
  };

  const path = points.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(p.v).toFixed(1)}`);
  lineEl.setAttribute('d', path.join(' '));
  areaEl.setAttribute('d', `${path.join(' ')} L${x(points.length - 1).toFixed(1)} ${PLOT.h}`
    + ` L${x(0).toFixed(1)} ${PLOT.h} Z`);

  // Редкие данные линией не читаются — отмечаем точки маркерами.
  dotsEl.innerHTML = points.length > 40 ? '' : points.map((p, i) =>
    `<circle cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="3"
             fill="var(--series)"></circle>`).join('');

  // Сетка — рецессивная, три линии: низ, середина, верх.
  card.querySelector('[data-role="grid"]').innerHTML = [0, 0.5, 1]
    .map(share => {
      const yPos = y(low + share * (high - low)).toFixed(1);
      return `<line x1="0" x2="${PLOT.w}" y1="${yPos}" y2="${yPos}"
                    stroke="var(--grid)" stroke-width="1"
                    vector-effect="non-scaling-stroke"></line>`;
    }).join('');

  valueEl.textContent = fmt(last, metric.unit);
  valueEl.className = 'value'
    + (metric.crit && last >= metric.crit ? ' critical'
      : metric.warn && last >= metric.warn ? ' warning' : '');
  peakEl.textContent = 'максимум за период: ' + fmt(peak, metric.unit)
    + ' · точек: ' + points.length;

  card._plot = { points, x, y, metric };
}

function attachHover() {
  for (const metric of METRICS) {
    const card = document.getElementById('card-' + metric.key);
    const svg = card.querySelector('svg');
    const cursor = card.querySelector('[data-role="cursor"]');
    const tip = card.querySelector('[data-role="tip"]');

    svg.addEventListener('pointermove', event => {
      const plot = card._plot;
      if (!plot || !plot.points.length) return;

      const box = svg.getBoundingClientRect();
      const share = (event.clientX - box.left) / box.width;
      // Ось по времени — ближайшую точку ищем по координате, а не по номеру.
      const pointerX = share * PLOT.w;
      let index = 0;
      for (let i = 1; i < plot.points.length; i++) {
        if (Math.abs(plot.x(i) - pointerX) < Math.abs(plot.x(index) - pointerX)) index = i;
      }
      const point = plot.points[index];

      cursor.setAttribute('opacity', '1');
      cursor.querySelector('line').setAttribute('x1', plot.x(index));
      cursor.querySelector('line').setAttribute('x2', plot.x(index));
      cursor.querySelector('circle').setAttribute('cx', plot.x(index));
      cursor.querySelector('circle').setAttribute('cy', plot.y(point.v));

      const time = new Date(point.t).toLocaleTimeString('ru-RU');
      tip.textContent = `${time} · ${fmt(point.v, metric.unit)}`;
      tip.style.opacity = '1';
      tip.style.left = Math.min(box.width - 130, share * box.width + 8) + 'px';
      tip.style.top = (svg.offsetTop + 8) + 'px';
    });

    svg.addEventListener('pointerleave', () => {
      cursor.setAttribute('opacity', '0');
      tip.style.opacity = '0';
    });
  }
}

// Табличный вид — идентичность и значения без опоры на цвет и наведение.
function renderTable(all) {
  if (!all.length || !all[0].points.length) {
    document.getElementById('table').innerHTML =
      '<p class="meta">За выбранный период истории нет.</p>';
    return;
  }
  const rows = all[0].points.map((point, i) => {
    const cells = all.map(entry => {
      const value = entry.points[i];
      return `<td>${value ? fmt(value.v, entry.metric.unit) : '—'}</td>`;
    }).join('');
    return `<tr><td>${new Date(point.t).toLocaleTimeString('ru-RU')}</td>${cells}</tr>`;
  });
  document.getElementById('table').innerHTML = `
    <table>
      <caption>Те же данные таблицей, от старых к новым</caption>
      <thead><tr><th>Время</th>${
        all.map(entry => `<th>${entry.metric.title}</th>`).join('')}</tr></thead>
      <tbody>${rows.join('')}</tbody>
    </table>`;
}

async function loadedModels() {
  try {
    const { models } = await json(OLLAMA);
    if (!models || !models.length) return 'модель не загружена';
    return models.map(model => {
      const onGpu = model.size ? Math.round(100 * model.size_vram / model.size) : 0;
      return `${model.name} — ${Math.round(model.size_vram / 1048576)} МБ, ${onGpu}% GPU`;
    }).join('; ');
  } catch {
    return 'состояние моделей недоступно';
  }
}

async function refresh() {
  const err = document.getElementById('err');
  try {
    const to = Date.now();
    const from = to - range * 1000;
    const all = [];
    for (const metric of METRICS) {
      const points = await series(metric);
      draw(metric, points, from, to);
      all.push({ metric, points });
    }
    if (!document.getElementById('table').hidden) renderTable(all);
    document.getElementById('meta').textContent = await loadedModels();
    err.hidden = true;
  } catch (error) {
    err.textContent = 'Ошибка данных: ' + error.message
      + '. Проверьте, что контейнер netdata запущен.';
    err.hidden = false;
  }
}

document.querySelectorAll('[data-range]').forEach(button => {
  button.addEventListener('click', () => {
    document.querySelectorAll('[data-range]').forEach(other =>
      other.setAttribute('aria-pressed', String(other === button)));
    range = Number(button.dataset.range);
    refresh();
  });
});

document.getElementById('toggle-table').addEventListener('click', event => {
  const table = document.getElementById('table');
  table.hidden = !table.hidden;
  event.currentTarget.setAttribute('aria-pressed', String(!table.hidden));
  refresh();
});

(async () => {
  build();
  attachHover();
  charts = await discover();
  await refresh();
  setInterval(refresh, 5000);
})();
</script>
</body>
</html>
